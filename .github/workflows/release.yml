# Build and verify a Windows installer, or publish artifacts from a verified run.
# The gates run side by side on separate runners; a run passes only when every
# gate job passes, and the regression job proves the shards ran every module once.
name: Windows installer

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: 'Publish artifacts from this successful installer run; empty builds normally'
        type: string
        default: ''
      verified_sha:
        description: 'Exact 40-character source SHA of the verified installer run'
        type: string
        default: ''
      beta_tag:
        description: 'Beta tag for verified publication'
        type: string
        default: ''
      release_notes:
        description: 'Source-bound release notes including the verified run URL'
        type: string
        default: ''

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: '1'

jobs:
  build:
    name: build
    if: ${{ !inputs.verified_run_id }}
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      installer: ${{ steps.version.outputs.installer }}
      display_version: ${{ steps.version.outputs.display_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path packaging/installer.nsi -Pattern '^!define APP_VERSION "([0-9]+\.[0-9]+(?:\.[0-9]+){0,2})"$'
          if (-not $match) { throw 'Installer version is missing.' }
          $version = $match.Matches[0].Groups[1].Value
          $channel = Select-String -Path packaging/installer.nsi -Pattern '^!define APP_CHANNEL "(beta)"$'
          $releaseVersion = if ($channel) { "$version-beta" } else { $version }
          $displayVersion = if ($channel) { "$version Beta" } else { $version }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$releaseVersion") {
            throw 'Release tag does not match installer version.'
          }
          "INSTALLER=PoE2-Data-Logger-Setup-v$releaseVersion.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DISPLAY_VERSION=$displayVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PRERELEASE=$([bool]$channel)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "installer=PoE2-Data-Logger-Setup-v$releaseVersion.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "display_version=$displayVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$([bool]$channel)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: ./.github/actions/python-deps
      - name: Prepare NSIS
        shell: pwsh
        run: |
          $nsis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $nsis) {
            $path = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
            if (-not (Test-Path $path)) {
              choco install nsis --yes --no-progress
              if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
            }
            if (-not (Test-Path $path)) { throw 'NSIS compiler was not found.' }
            Split-Path $path | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Build and verify installer
        run: python tools/run_build.py
      - name: Check installer, update and saved-file retention
        run: python tools/verify_installer.py $env:INSTALLER
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash $env:INSTALLER -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:INSTALLER" | Out-File -FilePath "$env:INSTALLER.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            PoE2-Data-Logger-Setup-v*.exe
            PoE2-Data-Logger-Setup-v*.exe.sha256
          if-no-files-found: error

  windows-checks:
    name: windows-checks
    if: ${{ !inputs.verified_run_id }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-deps
      - name: Check Windows display and export fixtures
        # Platform-specific fixtures run single-process here, beside the session
        # and the sharded suite; native-coordinate guards remain covered here.
        run: |
          python tools/run_tests.py --pattern 'test_region_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Region fixture checks failed.' }
          python tools/run_tests.py --pattern test_platform.py
          if ($LASTEXITCODE -ne 0) { throw 'Platform fixture checks failed.' }
          python tools/run_tests.py --pattern test_kill_count_hotkey.py
          if ($LASTEXITCODE -ne 0) { throw 'Kill-count capture fixture checks failed.' }
          python tools/run_tests.py --pattern test_user_review_navigation.py
          if ($LASTEXITCODE -ne 0) { throw 'Review navigation fixture checks failed.' }
          python tools/run_tests.py --pattern test_chain_approval_responsiveness.py
          if ($LASTEXITCODE -ne 0) { throw 'Chain contention and cleanup fixture checks failed.' }
          python tools/run_tests.py --pattern test_snapshot_shortcut_contention_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Snapshot/shortcut contention fixture checks failed.' }
          python tools/run_tests.py --pattern test_export_settings_guard.py
          if ($LASTEXITCODE -ne 0) { throw 'Spreadsheet export regression checks failed.' }
      - name: Check native Windows HUD interaction
        # Real Windows input and hit testing complement offscreen workflow checks.
        # A failed native pass blocks installer publication and retains screenshots.
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: windows
          POE2_NATIVE_HUD_ARTIFACTS: ${{ runner.temp }}/poe2-native-hud
        run: |
          python tools/run_tests.py --pattern test_native_windows_hud.py
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows HUD checks failed.' }
          $report = Join-Path $env:POE2_NATIVE_HUD_ARTIFACTS 'native-hud-report.json'
          if (-not (Test-Path $report)) { throw 'Native HUD proof is missing; skipped tests cannot publish.' }
          $hud = Get-Content $report -Raw | ConvertFrom-Json
          if ($hud.status -ne 'passed' -or $hud.qt_platform -ne 'windows' -or
              $hud.input_backend -ne 'Win32 SendInput' -or $hud.native_input_events -le 0) {
            throw 'Native Windows interaction was not verified.'
          }
      - name: Retain native HUD screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-hud-verification
          path: ${{ runner.temp }}/poe2-native-hud
          if-no-files-found: ignore

  session:
    name: session
    if: ${{ !inputs.verified_run_id }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-deps
      - name: Verify 100-map user workflow
        # This simulation injects scan results at the UI boundary; capture OCR
        # regressions are separate checks, not evidence from this simulation.
        env:
          POE2_RUN_HUNDRED_MAP_SESSION: '1'
          POE2_SESSION_ARTIFACTS: ${{ runner.temp }}/poe2-release-session
          RUNESHAPE_SCAN_DATA_DIR: ${{ runner.temp }}/poe2-release-bootstrap
        run: python tools/run_tests.py --pattern test_hundred_map_session.py
      - name: Retain session verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-session-verification
          path: ${{ runner.temp }}/poe2-release-session
          if-no-files-found: ignore

  regression-shard:
    name: regression shard ${{ matrix.shard }}
    if: ${{ !inputs.verified_run_id }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-deps
      - name: Run regression tests
        # Each shard runs every sixth batch of 20 modules. Batches are isolated
        # processes; two at once fit the runner's memory.
        run: python tools/run_tests.py --jobs 2 --shard ${{ matrix.shard }}/${{ strategy.job-total }} --summary-file regression-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: regression-shard-${{ matrix.shard }}
          path: regression-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  regression:
    name: regression
    if: ${{ !inputs.verified_run_id }}
    needs: regression-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: regression-shard-*
          path: shard-reports
          merge-multiple: true
      - name: Verify every test module ran once and passed
        run: python tools/run_tests.py --verify-shards shard-reports/*.json

  publish:
    name: publish tagged release
    needs: [build, windows-checks, session, regression]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      INSTALLER: ${{ needs.build.outputs.installer }}
      DISPLAY_VERSION: ${{ needs.build.outputs.display_version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
      - name: Publish release
        # The build's version check binds installer metadata to the release tag.
        shell: pwsh
        run: |
          $releaseArgs = @('release', 'create', $env:GITHUB_REF_NAME, $env:INSTALLER, "$env:INSTALLER.sha256", '--verify-tag', '--target', 'main', '--title', "PoE2 Data Logger $($env:DISPLAY_VERSION)")
          if ($env:PRERELEASE -eq 'True') { $releaseArgs += @('--prerelease', '--latest=false', '--notes-file', 'docs/RELEASE_1.3.2.33.md') }
          else { $releaseArgs += @('--latest=true', '--notes-file', 'docs/RELEASE_1.3.2.md') }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

  publish_verified_beta:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verified_run_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
      VERIFIED_SHA: ${{ inputs.verified_sha }}
      BETA_TAG: ${{ inputs.beta_tag }}
      BETA_RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish the verified beta installer
        run: python tools/publish_verified_beta.py
